<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MOVIEMANIA</title>

    <link
      rel="icon"
      type="image/png"
      href="media/png-clipart-film-cinematography-movie-camera-computer-icons-others-miscellaneous-photography-thumbnail.png"
      id="Icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./Css/all.min.css" />
    <link rel="stylesheet" href="./Css/fonts.css" />
    <link rel="stylesheet" href="./Css/global.css" />
    <link rel="stylesheet" href="./Css/style.css" />
    <link rel="stylesheet" href="./Css/keyframes.css" />
    <link rel="stylesheet" href="./Css/index.responsive.css" />

    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>

  <body>
    <nav class="navbar-custom">
      <div class="container navbar-container">
        <!-- Logo -->
        <a href="#" class="navbar-logo">
          <img
            src="media/clapperboard-film-logo-icon-design-template-vector-isolated-png_236642.jpg"
            alt="MOVIEMANIA"
          />
          <span>MOVIEMANIA</span>
        </a>

        <!-- Links -->
        <ul class="navbar-links">
          <li><a href="#Latest-releases">Latest</a></li>
          <li><a href="#Trending-Movies">Trending</a></li>
          <li><a href="#Top-Rated">Top Rated</a></li>
           <li><a href="favourites.html">Favourites</a></li>
          <li><a href="watchlist.html">Watchlist</a></li>
        </ul>

        <!-- Right side -->
        <div class="navbar-right">
          <a href="login.html" class="login-btn" id="loginNavBtn">
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
          </a>
          <div class="user-profile d-none" id="userProfile">
            <div class="profile-icon"><i class="fa-solid fa-user"></i></div>
            <span id="usernameDisplay"></span>
          </div>

          <button class="logout-btn d-none" id="logoutBtn" > <i class="fa-solid fa-right-from-bracket"></i> Logout </button>

          <div class="btnNav">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </nav>

    <!-- ================= HERO ================= -->
    <header class="hero">
      <div class="overlay"></div>

      <div class="hero-content text-center">
        <h1>MOVIEMANIA</h1>
        <p>Discover Trending, Popular and Top Rated Movies</p>
      </div>
    </header>

    <!-- ================= LATEST ================= -->
    <section id="Latest-releases" class="movies-section py-5">
      <div class="container">
        <h2 class="section-title">Latest Releases</h2>

        <div class="movies-slider">
          <button
            class="slider-btn left-btn"
            onclick="scrollMovies('moviesContainer', -1)"
          >
            <i class="fa-solid fa-chevron-left"></i>
          </button>

          <div id="moviesContainer" class="movie-row"></div>

          <button
            class="slider-btn right-btn"
            onclick="scrollMovies('moviesContainer', 1)"
          >
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- ================= TRENDING ================= -->
    <section id="Trending-Movies" class="movies-section py-5">
      <div class="container">
        <h2 class="section-title">Trending Movies</h2>

        <div class="movies-slider">
          <button
            class="slider-btn left-btn"
            onclick="scrollMovies('trendingMoviesContainer', -1)"
          >
            <i class="fa-solid fa-chevron-left"></i>
          </button>

          <div id="trendingMoviesContainer" class="movie-row"></div>

          <button
            class="slider-btn right-btn"
            onclick="scrollMovies('trendingMoviesContainer', 1)"
          >
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- ================= TOP RATED ================= -->
    <section id="Top-Rated" class="movies-section py-5">
      <div class="container">
        <h2 class="section-title">Top Rated</h2>

        <div class="movies-slider">
          <button
            class="slider-btn left-btn"
            onclick="scrollMovies('topRatedMoviesContainer', -1)"
          >
            <i class="fa-solid fa-chevron-left"></i>
          </button>

          <div id="topRatedMoviesContainer" class="movie-row"></div>

          <button
            class="slider-btn right-btn"
            onclick="scrollMovies('topRatedMoviesContainer', 1)"
          >
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- ================= LOADING ================= -->
    <div id="loading" class="text-center py-4 d-none">
      <div class="spinner-border text-danger"></div>
      <p class="mt-2">Loading movies...</p>
    </div>

    <div id="favToast" class="fav-toast">
      <div class="fav-toast-icon"><i class="fa-solid fa-heart"></i></div>
      <div class="fav-toast-content">
        <h5>Added to Favourites</h5>
        <p>Movie added successfully ❤️</p>
      </div>
      <button class="fav-toast-close" onclick="hideFavToast()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/favourites.js"></script>
    <script src="./js/auth.js"></script>
     <script src="./js/watchList.js"></script>
  </body>
</html>
