<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - MOVIEMANIA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="auth-page">
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar-custom">
      <div class="container navbar-container">
        <a href="index.html" class="navbar-logo">
          <img
            src="media/png-clipart-film-cinematography-movie-camera-computer-icons-others-miscellaneous-photography-thumbnail.png"
            alt="MOVIEMANIA"
          />
          <span>MOVIEMANIA</span>
        </a>
        <a href="login.html" class="auth-back">
          <i class="fa-solid fa-arrow-left"></i> Back to login
        </a>
      </div>
    </nav>
    <!-- ================= REGISTER ================= -->
    <main class="auth-container">
      <div class="auth-card">
        <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">
          Join MOVIEMANIA and save your favourite movies
        </p>
        <form id="registerForm">
          <!-- Name -->
          <div class="auth-input">
            <i class="fa-solid fa-user"></i>
            <input
              type="text"
              id="registerName"
              placeholder="Full Name"
              required
            />
          </div>
          <!-- Email -->
          <div class="auth-input">
            <i class="fa-solid fa-envelope"></i>
            <input
              type="email"
              id="registerEmail"
              placeholder="Email Address"
              required
            />
          </div>
          <!-- Password -->
          <div class="auth-input">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="registerPassword"
              placeholder="Password"
              minlength="6"
              required
            />
          </div>
          <!-- Confirm Password -->
          <div class="auth-input">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm Password"
              minlength="6"
              required
            />
          </div>
          <!-- Error Message -->
          <p id="registerError" class="auth-error"></p>
          <!-- Register -->
          <button type="submit" class="auth-btn">Create Account</button>
        </form>
        <p class="auth-switch">
          Already have an account? <a href="login.html"> Login </a>
        </p>
      </div>
    </main>
    <script src="js/auth.js"></script>
  </body>
</html>
