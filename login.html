<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MOVIEMANIA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="Css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="auth-page">


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar-custom">

        <div class="container navbar-container">

            <a href="index.html" class="navbar-logo">

                <img
                    src="media/png-clipart-film-cinematography-movie-camera-computer-icons-others-miscellaneous-photography-thumbnail.png"
                    alt="MOVIEMANIA"
                >

                <span>MOVIEMANIA</span>

            </a>

        </div>

    </nav>


    <!-- ================= LOGIN ================= -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your MOVIEMANIA account
            </p>


            <form id="loginForm">

                <!-- Email -->

                <div class="auth-input">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email Address"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="auth-input">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >

                </div>


                <!-- Options -->

                <div class="auth-options">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Error -->

                <p
                    id="loginError"
                    class="auth-error"
                ></p>


                <!-- Login -->

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
